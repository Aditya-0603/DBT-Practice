
version: 2

sources:
  - name: customer_data
    database: dbt_practice
    schema: raw
    tables:
      - name: customers
        columns:
          - name: customer_id
            tests:
              - not_null
              - unique

          - name: customer_name
            tests:
              - not_null

          - name: city
            tests:
              - not_null

          - name: age
            tests:
              - not_null
